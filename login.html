<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<title>Login · CardioSense</title>
</head>

<body>
{% include "_bg_hearts.html" %}

<div class="container">
    <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.3C.6 9.7 1.4 6 4.4 4.8 6.7 3.9 9 4.8 12 8c3-3.2 5.3-4.1 7.6-3.2 3 1.2 3.8 4.9 1.7 7.9C18.7 16.65 12 21 12 21z" fill="#ff4d6d"/></svg>
        <h2>CardioSense</h2>
    </div>
    <p class="subtitle">Sign in to access the heart disease risk predictor</p>

    <div class="ecg-wrap">
        <svg viewBox="0 0 600 60" preserveAspectRatio="none">
            <path class="ecg-line" d="M0,30 L60,30 L75,10 L90,50 L105,30 L140,30 L155,15 L170,45 L185,30 L300,30 L315,10 L330,50 L345,30 L380,30 L395,15 L410,45 L425,30 L600,30
                                       M600,30 L660,30 L675,10 L690,50 L705,30 L740,30 L755,15 L770,45 L785,30 L900,30 L915,10 L930,50 L945,30 L980,30 L995,15 L1010,45 L1025,30 L1200,30" />
        </svg>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>

        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
